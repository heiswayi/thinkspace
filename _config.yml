# Site settings
title_left    : "dwaine"
title_right   : "" # default: ""
description   : "Professional & hobby blog — software engineering, home lab experiments, and things I build and break along the way."
keywords      : "software engineering, homelab, docker, raspberry pi, home automation, self-hosting"
url           : https://www.gallimore.dev # site url
baseurl       : "" # apply repo name like "/myproject" if used under gh-pages branch, else (under master branch) just leave empty/blank
cover         : "/assets/images/author.jpeg" # image uri like logo/cover image for site seo

comments_enabled  : false # if enabled (set to true), please provide your disqus_username
disqus_shortname  : ""
postshare_enabled : false

# Build settings
permalink     : /:year/:title/
markdown      : kramdown
highlighter   : rouge
paginate      : 10
paginate_path : "/page/:num/"

source      : ./
destination : ./_site

# Author settings
author:
  name     : "Dwaine Gallimore"

# Social links (used in the footer)
social:
  github        : "dwainegallimore"
  linkedin      : "" # e.g. "dwainegallimore" -> https://www.linkedin.com/in/dwainegallimore
  stackoverflow : "18683699/dwaine-gallimore"
  twitter       : "" # e.g. "handle" -> https://twitter.com/handle

plugins:
  - jekyll-sitemap
  - jekyll-paginate

# blog categories used to badge posts as work vs hobby content
categories_shown:
  - professional
  - homelab

# navbar pages
navbar:
  - slug : blog
    title: Blog
  - slug : projects
    title: Projects
  - slug : homelab
    title: Homelab
  - slug : about
    title: About

exclude:
  - "gulp"
  - "node_modules"
  - "bower"
  - "bower_components"
  - "config.rb"
  - "src"
  - "Gemfile"
  - "Gemfile.lock"
  - ".rvmrc"
  - ".rbenv-version"
  - "package.json"
  - "gulpfile.js"
  - "README.md"
  - "Rakefile"
  - "changelog.md"
  - "script"
  - "vendor"
